overview: |
  My research seeks to uncover the principles by which neural systems are built, in order to move from understanding brains to designing biological and artificial circuits. I study how genes and development give rise to functional connectivity, how evolution shapes wiring to support innate behaviors and learning, and how emerging connectomes and transcriptomes can reveal the organizing rules that link these scales.

past_work:
  intro: |
    This work has been guided by a broader conviction, one I articulated in a [*JNeuro* TechSights](https://www.jneurosci.org/content/43/34/5989), that understanding the brain requires integrating cell identity, connectivity, and function across scales. I now see that **neural development is more than the assembly of brain structure: it is the installation of structured priors for lifelong behavior and learning.**
  themes:
    - id: molecular_rules
      title: "Molecular rules of circuit assembly."
      description: |
        I began my graduate work by asking: where and how is neuronal connectivity encoded? In a [*Neuron*](https://www.cell.com/neuron/fulltext/S0896-6273(19)30926-2) paper, I started from the hypothesis that **the genetic identity of neurons guides synapse and gap junction formation, and derived that this in turn generates biclique motifs**. In *C. elegans*, we found these connectivity patterns to be enriched for neurons with shared gene expression and morphological characteristics, implicating common genetic factors that drive synapse formation. This observation led me to ask whether such wiring rules could be inferred directly from biological data. In [*PNAS*](https://www.pnas.org/content/early/2020/12/11/2009093117), **I developed a theoretical framework — the Spatial Connectome Model — to extract the genetic determinants of connectivity from** three data sources: **the connectome**, **the transcriptome**, **and the contactome** (neuronal physical contacts). When applied to the gap junction network of *C. elegans*, we predicted 19 candidate interactions among innexin proteins, 5 of which were confirmed experimentally. More broadly, **this work showed that the molecular logic of connectivity can be treated as an inference problem, linking large-scale anatomical maps to mechanistic hypotheses about circuit formation.**
    - id: developmental_priors
      title: "Developmental priors for neural computation."
      description: |
        Inspired by these compact molecular rules underlying biological connectivity, I next asked whether genetic encoding could serve as a general principle for network construction. In [*Scientific Reports*](https://www.nature.com/articles/s41598-021-92577-2), **I defined a generative network model that uses simple heuristics to build scale-free and feed-forward topologies out of biclique motifs**. Building on this idea, I proposed the Genetic neuroEvolution Model (**GEM**, [*Nature Communications*](https://www.nature.com/articles/s41467-023-37980-1)), **in which artificial neural network weights are not optimized directly, but instead emerge from learned compatibility rules between neurons**, inspired by the developmental wiring models from my earlier [*Neuron*](https://www.cell.com/neuron/fulltext/S0896-6273(19)30926-2) and [*PNAS*](https://www.pnas.org/content/early/2020/12/11/2009093117) papers. Rather than improving task fitness by updating individual weights, GEM updates the neurons' wiring rules, mirroring evolutionary selection on developmental programs. We find that **GEM (1) provides sufficient representational power for strong performance on machine learning benchmarks while also compressing parameter counts, and (2) acts as an effective regularizer in meta-learning settings, favoring simpler and more stable circuit solutions.** I led both studies as first and corresponding author, coordinating international teams of graduate students, with several authors joining independently after discovering my preprint. Together, these two papers crystallized a theme that has remained central to my research: **development can be understood not just as a biological process, but as a source of structured priors that support efficient computation.**
    - id: experimental_validation
      title: "Experimental validation of the assembly of functional circuits."
      description: |
        I next sought to test my computational ideas experimentally, by asking whether complex behavior can emerge from developmental wiring alone. In [*Nature Communications*](https://www.nature.com/articles/s41467-023-44681-2), **I showed that the zebrafish optomotor response can mature even when neural activity is pharmacologically silenced throughout development**. After washout of the anesthetic, animals still performed visually guided behavior with high accuracy, and brain-wide imaging revealed that the underlying neural populations came online already tuned, without requiring activity-dependent refinement. Thus, complex sensory-guided behavior can be assembled by activity-independent developmental mechanisms. I later formalized this view in [*Nature Reviews Neuroscience*](https://www.nature.com/articles/s41583-025-00910-9), **proposing that circuit formation reflects three interacting systems:** **assembly**, in which genetically guided programs establish core circuitry; **updating**, where salient experiences rapidly modify synapses; and **tuning**, in which ongoing plasticity stabilizes and fine-tunes networks. This summarizes the implications of my experimental findings: rather than treating learning and plasticity as the primary architects of neural function, it suggests that many core competencies may first emerge through innate developmental programs, upon which later experience acts to update and refine.
    - id: connectome_architecture
      title: "Organizational principles of connectome architecture."
      description: |
        As neuronal-level maps became available, I returned to the question of how brain-wide connectivity is organized. Collating eight connectomes across five species, **I found that canonical network-science models do not capture brain architecture**: neuronal degree and connection strength were consistently better approximated by lognormals than by random or scale-free distributions. To address this inconsistency, **we reframed the brain as a physical network of spatially extended neurons, thereby providing a mechanistic model**: stochastic multiplicative growth of arbor length provides a common developmental basis for the observed distributions of neuron length and degree. This framework, now under review at [*Science*](https://www.biorxiv.org/content/10.1101/2025.02.27.640551v1), links morphology, connectivity, and network organization in a unified quantitative theory, generating empirically falsifiable relationships among neuronal properties.
    - id: agentic_ai
      title: "Agentic AI for scientific discovery."
      description: |
        As a FutureHouse AI-for-Science Fellow, I am working on the design and evaluation of an AI Scientist (Kosmos, under review at [*Nature*](https://arxiv.org/abs/2511.02824)) that integrates hypothesis-guided literature search and data analysis into iterative scientific workflows. This gave me unusual firsthand experience with a new methodological frontier: **building AI systems that do not merely summarize knowledge, but produce mechanistic insight**. In evaluating Kosmos on connectomics, I found that it could not only reproduce the central empirical findings of my [preprint](https://www.biorxiv.org/content/10.1101/2025.02.27.640551v1), but also recovered the underlying interpretation. I now see agentic systems as essential partners in extracting organizing principles from large-scale brain datasets, and am continuing to pioneer AI-assisted theory-building as a core methodology for connectomic discovery.
